[project]
name = "agent-assistant"
version = "0.1.0"
description = "Personal desktop Agentic assistant for Windows"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pywinauto>=0.6.8",
    "keyboard>=0.13.5",
    "trafilatura>=1.6.0",
    "pywebview>=5.0.0",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
voice = [
    "sherpa-onnx>=1.10.0",
    "edge-tts>=6.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
agent-assistant = "agent_assistant.main:main"
agent-assistant-mcp = "agent_assistant.hosted.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_assistant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
