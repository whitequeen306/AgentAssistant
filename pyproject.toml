[project]
name = "agent-assistant"
version = "0.1.0"
description = "Personal desktop Agentic assistant for Windows"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pywinauto>=0.6.8",
    "keyboard>=0.13.5",
    "trafilatura>=1.6.0",
    "pywebview>=5.0.0",
    "tiktoken>=0.7.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    # read_document / read_file 的 PDF 解析（fitz 已是事实依赖，此处显式声明）
    "pymupdf>=1.24.0",
    "Pillow>=10.0.0",
    # docx 读取（read_file）与导出（export/md_to_docx）
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
voice = [
    "sherpa-onnx>=1.10.0",
    "edge-tts>=6.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
]
# 扫描件 PDF / 图片 OCR：除 pip 包外还需系统安装 tesseract（含 chi_sim 语言包）。
# 未安装时 read_document 会明确报错，不会静默返回空内容。
ocr = [
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
agent-assistant = "agent_assistant.main:main"
agent-assistant-mcp = "agent_assistant.hosted.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_assistant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
